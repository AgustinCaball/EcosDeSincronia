name: Export APK with Godot CI

on: [push]

jobs:
  export-android:
    runs-on: ubuntu-latest
    name: Export Android APK
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Export to Android
        uses: firebelley/godot-export@v3.2.0
        with:
          godot_version: 3.6.stable
          godot_export_templates_version: 3.6.stable
          relative_path: ''
          archive_output: false
          android_export_preset: Android
          export_debug: true
          use_godot_3: true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EcosDeSincronia-APK
          path: /home/runner/work/EcosDeSincronia/EcosDeSincronia/build/Android/*.apk
