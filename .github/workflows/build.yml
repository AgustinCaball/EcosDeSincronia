name: Compile Godot 3.6 APK Final

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Godot APK
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Godot 3.6
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/3.6-stable/Godot_v3.6-stable_linux_headless.64.zip
          wget -q https://github.com/godotengine/godot/releases/download/3.6-stable/Godot_v3.6-stable_export_templates.tpz
          unzip -q Godot_v3.6-stable_linux_headless.64.zip
          unzip -q Godot_v3.6-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/templates/3.6.stable
          mv templates/* ~/.local/share/godot/templates/3.6.stable/

      - name: Generate Keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000

      - name: Configure Godot Editor Settings
        run: |
          mkdir -p ~/.config/godot
          cat <<EOF > ~/.config/godot/editor_settings-3.tres
          [gd_resource type="EditorSettings" format=2]
          [resource]
          export/android/adb = "/usr/local/lib/android/sdk/platform-tools/adb"
          export/android/jarsigner = "$(which jarsigner)"
          export/android/debug_keystore = "${GITHUB_WORKSPACE}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import Assets First
        run: |
          ./Godot_v3.6-stable_linux_headless.64 --editor --quit || true

      - name: Export APK
        run: |
          mkdir -p build
          ./Godot_v3.6-stable_linux_headless.64 --export-debug "Android" ./build/EcosDeSincronia.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EcosDeSincronia-APK
          path: build/EcosDeSincronia.apk
