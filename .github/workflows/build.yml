name: Compile Godot 3.6 APK Final

on: [push]

jobs:
  build:
      runs-on: ubuntu-latest
      name: Build Godot APK
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Download Godot 3.6 Templates
          run: |
            wget https://github.com/godotengine/godot/releases/download/3.6-stable/Godot_v3.6-stable_linux_headless.64.zip
            wget https://github.com/godotengine/godot/releases/download/3.6-stable/Godot_v3.6-stable_export_templates.tpz
            unzip Godot_v3.6-stable_linux_headless.64.zip
            unzip Godot_v3.6-stable_export_templates.tpz
            mkdir -p ~/.local/share/godot/templates/3.6.stable
            mv templates/* ~/.local/share/godot/templates/3.6.stable/

        - name: Setup Android SDK Paths & Keystore
          run: |
            # 1. Generar la llave
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000
            
            # 2. Forzar las rutas de Android SDK, Jarsigner y Keystore en Godot
            mkdir -p ~/.config/godot
            cat <<EOF > ~/.config/godot/editor_settings-3.tres
            [gd_resource type="EditorSettings" format=2]
            [resource]
            export/android/adb = "/usr/local/lib/android/sdk/platform-tools/adb"
            export/android/jarsigner = "/usr/bin/jarsigner"
            export/android/debug_keystore = "${GITHUB_WORKSPACE}/debug.keystore"
            export/android/debug_keystore_user = "androiddebugkey"
            export/android/debug_keystore_pass = "android"
            EOF

        - name: Import Assets First (Fix Missing Scripts Error)
          run: ./Godot_v3.6-stable_linux_headless.64 --editor --quit || true

        - name: Export APK
          run: |
            mkdir -p build
            ./Godot_v3.6-stable_linux_headless.64 --export-debug "Android" ./build/EcosDeSincronia.apk

        - name: Upload APK artifact
          uses: actions/upload-artifact@v4
          with:
            name: EcosDeSincronia-APK
            path: build/EcosDeSincronia.apk
