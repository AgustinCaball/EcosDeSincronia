name: Compile Godot 3.6 APK Final

on: [push]

jobs:
  build:
      runs-on: ubuntu-latest
      name: Build Godot APK
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Install Java Dependencies
          run: |
            sudo apt-get update
            sudo apt-get install -y default-jdk

        - name: Download Godot 3.6
          run: |
            wget -q https://github.com/godotengine/godot/releases/download/3.6-stable/Godot_v3.6-stable_linux_headless.64.zip
            wget -q https://github.com/godotengine/godot/releases/download/3.6-stable/Godot_v3.6-stable_export_templates.tpz
            unzip -q Godot_v3.6-stable_linux_headless.64.zip
            unzip -q Godot_v3.6-stable_export_templates.tpz
            mkdir -p ~/.local/share/godot/templates/3.6.stable
            mv templates/* ~/.local/share/godot/templates/3.6.stable/

        - name: Import Assets First
          run: |
            # Iniciar Godot para generar archivos base SIN que borre nuestra llave
            ./Godot_v3.6-stable_linux_headless.64 --editor --quit || true

        - name: Generate Keystore & Inject Settings
          run: |
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000
            
            # Inyectar las rutas al final del archivo ya creado por Godot
            echo 'export/android/adb = "/usr/local/lib/android/sdk/platform-tools/adb"' >> ~/.config/godot/editor_settings-3.tres
            echo 'export/android/jarsigner = "/usr/bin/jarsigner"' >> ~/.config/godot/editor_settings-3.tres
            echo 'export/android/debug_keystore = "'$(pwd)'/debug.keystore"' >> ~/.config/godot/editor_settings-3.tres
            echo 'export/android/debug_keystore_user = "androiddebugkey"' >> ~/.config/godot/editor_settings-3.tres
            echo 'export/android/debug_keystore_pass = "android"' >> ~/.config/godot/editor_settings-3.tres

        - name: Export APK
          run: |
            mkdir -p build
            
            # Buscar el nombre exacto de tu preset de Android en tu propio proyecto
            PRESET_NAME=$(grep -A 2 '\[preset\.' export_presets.cfg | grep 'name=' | grep -i 'android' | cut -d '"' -f 2 | head -n 1)
            if [ -z "$PRESET_NAME" ]; then PRESET_NAME="Android"; fi
            
            echo "Exportando con el preset exacto: $PRESET_NAME"
            ./Godot_v3.6-stable_linux_headless.64 --export-debug "$PRESET_NAME" build/EcosDeSincronia.apk

        - name: Upload APK artifact
          uses: actions/upload-artifact@v4
          with:
            name: EcosDeSincronia-APK
            path: build/EcosDeSincronia.apk
